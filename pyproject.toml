[project]
name = "telegram-script-bot"
version = "0.1.0"
description = "Telegram bot to execute approved local scripts by command name."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.0",
]

[project.scripts]
telegram-script-bot = "telegram_script_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["telegram_script_bot*"]
